[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drive-tagger"
version = "0.1.0"
description = "Agentic, LLM-in-the-loop tagger for Google Drive: a Cursor SDK agent calls MCP tools to embed documents (turbovecdb), reason about an evolving category taxonomy, and record rich connections (multiple categories + typed file-to-file links)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kostadis Roussos", email = "kostadis@gmail.com" }]
keywords = ["google-drive", "tagging", "embeddings", "agent", "mcp", "cursor-sdk", "turbovecdb"]
dependencies = [
    "cursor-sdk>=0.1.8",
    "mcp>=1.10",
    "fastembed>=0.3",
    "numpy>=1.21",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "typer>=0.12",
    "tqdm>=4.66",
    "turbovecdb",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

[project.scripts]
drive-tagger = "drive_tagger.cli:app"

[project.urls]
Repository = "https://github.com/kostadis/drive-tagger"

[tool.uv.sources]
turbovecdb = { path = "../../turbovecdb", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/drive_tagger"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
