[package]
name = "gdrive-cli"
version = "1.0.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP & APIs
reqwest = { version = "0.12", features = ["json"] }

# OAuth2 for Google auth - using simple token-based approach
oauth2 = "4.4"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
anyhow = "1"
regex = "1"
dirs = "5"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
mockito = "1.0"
serde_json = "1"