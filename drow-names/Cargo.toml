[package]
name = "drow-names"
version = "0.1.0"
edition = "2021"
description = "Drow name generator from the Dragon #267 name-element table (data kept in homebrew-private)"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
