[package]
name = "adventure_model"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
regex = "1.10"
lazy_static = "1.4"
pyo3 = { version = "0.20", features = ["extension-module"] }

[features]
default = []
python = ["pyo3/extension-module"]