[package]
name = "adventure_model_minimal"
version = "0.1.0"
edition = "2021"

[lib]
name = "adventure_model_minimal"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
pyo3 = { version = "0.21", features = ["extension-module"] }