[package]
name = "rpg-source-select"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Read-only RPG PDF source selection with evidence-bound review"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
sha2 = "0.10"
csv = "1"
regex = "1"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lopdf = "0.47"
thiserror = "2"
roxmltree = "0.20"
libc = "0.2"
unicode-normalization = "0.1.26"
unicode-casefold = "0.2.0"

[dev-dependencies]
tempfile = "3"

